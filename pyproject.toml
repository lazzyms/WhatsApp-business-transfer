[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-migrate"
dynamic = ["version"]
description = "Move WhatsApp Business chats from Android to iPhone, locally, without a cloud service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["wa-crypt-tools>=0.1.0"]
keywords = ["whatsapp", "whatsapp-business", "android", "ios", "migration", "backup"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wa-migrate = "wa_migrate.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wa_migrate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wa_migrate = ["cdvalidate.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
